[workspace]
resolver = "2"
members = [
    "crates/stow_core",
    "crates/stow_cli",
    "crates/stow_gui",
    "crates/stow_ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Antigravity Developer"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
crc32fast = "1.4"
blake3 = "1.5"
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
byteorder = "1.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
rfd = "0.15"
crossbeam-channel = "0.5"
tempfile = "3.14"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true


