name: Create GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-all:
    name: Build All Platforms & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Setup Rust
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      # 2. Build Linux Binaries
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libssl-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libfontconfig1-dev

      - name: Build Linux Release
        run: |
          cargo build --release --workspace
          cp target/release/secret_png_gui ./SecretPNG_Linux_x86_64
          chmod +x ./SecretPNG_Linux_x86_64

      # 3. Build Android APK
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        working-directory: android_app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../SecretPNG_Android.apk

      # 4. Copy Standalone Windows Executable
      - name: Copy Windows Standalone Executable
        run: |
          cp dist/windows/SecretPNG_GUI.exe ./SecretPNG_Windows_x64.exe

      # 5. Create GitHub Release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Secret PNG v1.0.0 - Official Multi-Platform Release"
          body: |
            # 🛡️ Secret PNG v1.0.0 - Official Release

            High-speed steganographic video concealer and extractor with 256-bit ChaCha20-Poly1305 + Argon2id encryption and universal zero-limit streaming.

            ---

            ### 📦 Direct Downloads:
            - **🪟 Windows (Standalone .exe)**: [`SecretPNG_Windows_x64.exe`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SecretPNG_Windows_x64.exe) *(No installation or unzipping needed! Just download & double click)*
            - **📱 Android (APK)**: [`SecretPNG_Android.apk`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SecretPNG_Android.apk)
            - **🐧 Linux (64-bit)**: [`SecretPNG_Linux_x86_64`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SecretPNG_Linux_x86_64)

            ---

            ### ✨ Key Features:
            - **⚡ Universal Stream Engine**: Embed multi-gigabyte videos/movies (even 14GB–50GB+) into any image file.
            - **🖼️ 100% Viewer Compatibility**: Resulting carrier images open instantly in Windows Photos, MS Paint, Android Gallery, and Apple Photos.
            - **🔐 Password Protection**: Military-grade ChaCha20-Poly1305 AEAD + Argon2id key derivation.
            - **🚀 Native Performance**: 1.3+ GB/s throughput with minimal RAM usage (< 15 MB).
            - **🛡️ Integrity Verification**: Bit-perfect restoration verified by 256-bit BLAKE3 hash.
          files: |
            SecretPNG_Windows_x64.exe
            SecretPNG_Android.apk
            SecretPNG_Linux_x86_64
