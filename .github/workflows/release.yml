name: Create GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-all:
    name: Build All Platforms & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Setup Rust
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,x86_64-pc-windows-msvc

      # 2. Build Linux
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libssl-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libfontconfig1-dev zip

      - name: Build Linux Release
        run: |
          cargo build --release --workspace
          mkdir -p release_assets/linux
          cp target/release/secret_png_gui release_assets/linux/
          cp target/release/secret_png_cli release_assets/linux/
          cp install_linux.sh release_assets/linux/
          cp SecretPNG.desktop release_assets/linux/
          cd release_assets/linux
          tar -czvf ../../SecretPNG_v1.0.0_Linux_x86_64.tar.gz *
          cd ../..

      # 3. Build Android APK
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        working-directory: android_app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../SecretPNG_v1.0.0_Android.apk

      # 4. Package Windows Binaries from dist/windows
      - name: Package Windows Binaries
        run: |
          mkdir -p release_assets/windows
          cp dist/windows/SecretPNG_GUI.exe release_assets/windows/
          cp dist/windows/secret-png.exe release_assets/windows/
          cp dist/windows/secret_png_ffi.dll release_assets/windows/
          cp Launch_SecretPNG_Windows.vbs release_assets/windows/
          cp Launch_SecretPNG_Windows.cmd release_assets/windows/
          cd release_assets/windows
          zip -r ../../SecretPNG_v1.0.0_Windows_x64.zip *
          cd ../..

      # 5. Create GitHub Release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Secret PNG v1.0.0 - Official Multi-Platform Release"
          body: |
            # 🛡️ Secret PNG v1.0.0 - Official Release

            High-speed steganographic video concealer and extractor with 256-bit ChaCha20-Poly1305 + Argon2id encryption and universal zero-limit streaming.

            ---

            ### 📦 Download Assets:
            - **🪟 Windows (64-bit)**: [`SecretPNG_v1.0.0_Windows_x64.zip`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SecretPNG_v1.0.0_Windows_x64.zip)
            - **📱 Android (APK)**: [`SecretPNG_v1.0.0_Android.apk`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SecretPNG_v1.0.0_Android.apk)
            - **🐧 Linux (64-bit)**: [`SecretPNG_v1.0.0_Linux_x86_64.tar.gz`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SecretPNG_v1.0.0_Linux_x86_64.tar.gz)

            ---

            ### ✨ Key Features:
            - **⚡ Universal Stream Engine**: Embed multi-gigabyte videos/movies (even 14GB–50GB+) into any image file.
            - **🖼️ 100% Viewer Compatibility**: Resulting carrier images open instantly in Windows Photos, MS Paint, Android Gallery, and Apple Photos.
            - **🔐 Password Protection**: Military-grade ChaCha20-Poly1305 AEAD + Argon2id key derivation.
            - **🚀 Native Performance**: 1.3+ GB/s throughput with minimal RAM usage (< 15 MB).
            - **🛡️ Integrity Verification**: Bit-perfect restoration verified by 256-bit BLAKE3 hash.
          files: |
            SecretPNG_v1.0.0_Windows_x64.zip
            SecretPNG_v1.0.0_Android.apk
            SecretPNG_v1.0.0_Linux_x86_64.tar.gz
