name: 🐧 Build Linux (Manual)

on:
  workflow_dispatch: # Only runs when YOU click the button in GitHub Actions

jobs:
  build-linux:
    name: Compile Linux Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GUI Libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libssl-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libfontconfig1-dev

      - name: Build Release
        run: cargo build --release --workspace

      - name: Save Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: SecretPNG_Linux_x86_64
          path: target/release/secret_png_gui
