name: 🪟 Build Windows (Manual)

on:
  workflow_dispatch: # Only runs when YOU click the button in GitHub Actions

jobs:
  build-windows:
    name: Compile Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release
        run: cargo build --release --workspace

      - name: Save Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: SecretPNG_Windows_x64
          path: target/release/secret_png_gui.exe
