name: 🪟 Release Windows

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Version Tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release-windows:
    name: Build Windows & Upload to Release
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release
        run: cargo build --release --workspace

      - name: Prepare Executable
        run: Copy-Item -Path "target\release\secret_png_gui.exe" -Destination "Stow_Windows_x64.exe" -Force

      - name: Upload Windows Asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ github.event.inputs.tag_name }}"
          files: Stow_Windows_x64.exe
