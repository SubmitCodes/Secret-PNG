name: 🍎 Release macOS

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Version Tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release-macos:
    name: Build macOS & Upload to Release
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Build Universal macOS Binary
        run: |
          cargo build --release --target x86_64-apple-darwin --bin stow_gui
          cargo build --release --target aarch64-apple-darwin --bin stow_gui
          lipo -create -output Stow_macOS_universal target/x86_64-apple-darwin/release/stow_gui target/aarch64-apple-darwin/release/stow_gui
          chmod +x Stow_macOS_universal

      - name: Generate macOS .icns Icon & Package Stow_macOS.dmg
        run: |
          mkdir -p Stow.iconset
          sips -z 16 16     Stow.png --out Stow.iconset/icon_16x16.png
          sips -z 32 32     Stow.png --out Stow.iconset/icon_16x16@2x.png
          sips -z 32 32     Stow.png --out Stow.iconset/icon_32x32.png
          sips -z 64 64     Stow.png --out Stow.iconset/icon_32x32@2x.png
          sips -z 128 128   Stow.png --out Stow.iconset/icon_128x128.png
          sips -z 256 256   Stow.png --out Stow.iconset/icon_128x128@2x.png
          sips -z 256 256   Stow.png --out Stow.iconset/icon_256x256.png
          sips -z 512 512   Stow.png --out Stow.iconset/icon_256x256@2x.png
          sips -z 512 512   Stow.png --out Stow.iconset/icon_512x512.png
          sips -z 1024 1024 Stow.png --out Stow.iconset/icon_512x512@2x.png
          iconutil -c icns Stow.iconset -o Stow.icns

          mkdir -p Stow.app/Contents/MacOS
          mkdir -p Stow.app/Contents/Resources
          cp Stow.icns Stow.app/Contents/Resources/Stow.icns
          cp Stow_macOS_universal Stow.app/Contents/MacOS/Stow
          chmod +x Stow.app/Contents/MacOS/Stow

          cat << 'EOF' > Stow.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>Stow</string>
              <key>CFBundleIconFile</key>
              <string>Stow.icns</string>
              <key>CFBundleIdentifier</key>
              <string>com.submitcodes.stow</string>
              <key>CFBundleName</key>
              <string>Stow</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.13</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          mkdir -p dmg_root
          cp -r Stow.app dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "Stow" -srcfolder dmg_root -ov -format UDZO Stow_macOS.dmg

      - name: Upload macOS DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ github.event.inputs.tag_name }}"
          files: Stow_macOS.dmg
