name: 📱 Build Android APK (Manual)

on:
  workflow_dispatch: # Only runs when YOU click the button in GitHub Actions

jobs:
  build-android:
    name: Compile Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        working-directory: android_app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SecretPNG_Android_APK
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
